services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_chemistry
      POSTGRES_USER: campus_chemistry
      POSTGRES_PASSWORD: campus_chemistry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_chemistry -d campus_chemistry"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://campus_chemistry:campus_chemistry@postgres:5432/campus_chemistry
    ports:
      - "8000:8000"

volumes:
  postgres_data:
